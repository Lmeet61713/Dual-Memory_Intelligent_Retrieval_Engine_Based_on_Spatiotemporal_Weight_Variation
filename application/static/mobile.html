<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Homer · 移动端</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: #f0f2f5;
            overflow: hidden;
        }

        /* ===== 顶部导航 ===== */
        .top-bar {
            background: #4a90e2;
            color: #fff;
            padding: 0.7rem 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            height: 50px;
        }
        .top-bar h1 {
            font-size: 1.1rem;
            font-weight: 600;
        }
        .top-bar .session-indicator {
            font-size: 0.75rem;
            opacity: 0.85;
            max-width: 140px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ===== 会话列表侧滑面板 ===== */
        .drawer-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.35);
            z-index: 200;
            display: none;
        }
        .drawer-overlay.open { display: block; }

        .drawer {
            position: fixed;
            top: 0; left: 0; bottom: 0;
            width: 280px;
            background: #fff;
            z-index: 201;
            transform: translateX(-100%);
            transition: transform 0.25s ease;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 8px rgba(0,0,0,0.1);
        }
        .drawer.open { transform: translateX(0); }

        .drawer-header {
            padding: 1rem;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .drawer-header h3 { font-size: 1rem; color: #333; }
        .drawer-close {
            background: none; border: none;
            font-size: 1.4rem; color: #999;
            cursor: pointer; padding: 0 0.3rem;
        }

        .btn-new-session {
            margin: 0.8rem;
            padding: 0.6rem;
            background: #4a90e2;
            color: #fff;
            border: none;
            border-radius: 0.5rem;
            font-size: 0.9rem;
            cursor: pointer;
            font-weight: 600;
        }

        .session-list {
            flex: 1;
            overflow-y: auto;
            list-style: none;
        }
        .session-item {
            display: flex;
            align-items: center;
            padding: 0.7rem 1rem;
            cursor: pointer;
            border-bottom: 1px solid #f5f5f5;
            transition: background 0.15s;
        }
        .session-item:active { background: #e8f0fe; }
        .session-item.active { background: #e3edff; }
        .session-item .sess-info {
            flex: 1;
            min-width: 0;
        }
        .session-item .sess-id {
            font-size: 0.8rem;
            color: #333;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .session-item .sess-meta {
            font-size: 0.7rem;
            color: #999;
            margin-top: 0.15rem;
        }

        /* ===== 消息区域 ===== */
        .chat-container {
            position: fixed;
            top: 50px;
            left: 0; right: 0;
            bottom: 60px;
            overflow-y: auto;
            padding: 0.8rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .msg {
            display: flex;
            animation: msgIn 0.25s ease;
        }
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .msg.user { justify-content: flex-end; }
        .msg.assistant { justify-content: flex-start; }

        .bubble {
            max-width: 85%;
            padding: 0.55rem 0.85rem;
            border-radius: 1rem;
            font-size: 0.9rem;
            line-height: 1.55;
            word-break: break-word;
        }
        .user .bubble {
            background: #d4e6ff;
            border-bottom-right-radius: 0.2rem;
            color: #1a1a2e;
        }
        .assistant .bubble {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 0.2rem;
            color: #333;
        }
        .assistant .bubble.streaming {
            border-color: #4a90e2;
            background: #f5f9ff;
        }

        .empty-hint {
            text-align: center;
            color: #bbb;
            margin-top: 3rem;
            font-size: 0.9rem;
        }

        .system-msg {
            text-align: center;
            color: #aaa;
            font-size: 0.75rem;
            padding: 0.3rem 0;
        }

        /* ===== 底部输入 ===== */
        .input-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: #fff;
            border-top: 1px solid #e0e0e0;
            padding: 0.5rem 0.7rem;
            display: flex;
            gap: 0.5rem;
            align-items: center;
            height: 60px;
            z-index: 100;
        }
        #msgInput {
            flex: 1;
            padding: 0.6rem 0.8rem;
            border: 1px solid #d5d8de;
            border-radius: 1.5rem;
            font-size: 0.9rem;
            outline: none;
            background: #f5f6fa;
        }
        #msgInput:focus {
            border-color: #4a90e2;
            background: #fff;
        }
        #sendBtn {
            width: 44px; height: 44px;
            border-radius: 50%;
            background: #4a90e2;
            color: #fff;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #sendBtn:disabled {
            background: #b0c4de;
            cursor: not-allowed;
        }

        /* ===== 状态栏 ===== */
        .status-bar {
            position: fixed;
            top: 50px; left: 0; right: 0;
            height: 3px;
            z-index: 101;
        }
        .status-bar.loading {
            background: linear-gradient(90deg, #4a90e2 25%, #a0d2db 50%, #4a90e2 75%);
            background-size: 200% 100%;
            animation: loadingBar 1.5s ease infinite;
        }
        @keyframes loadingBar {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.75);
            color: #fff;
            padding: 0.5rem 1rem;
            border-radius: 1.5rem;
            font-size: 0.8rem;
            z-index: 300;
            animation: toastIn 0.3s ease, toastOut 0.3s 1.8s ease forwards;
        }
        @keyframes toastIn {
            from { opacity: 0; transform: translateX(-50%) translateY(-10px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        @keyframes toastOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
    </style>
</head>
<body>

<!-- 顶部导航 -->
<div class="top-bar">
    <button id="menuBtn" style="background:none;border:none;color:#fff;font-size:1.3rem;cursor:pointer;padding:0 0.3rem;">☰</button>
    <h1>🏠 Homer</h1>
    <span class="session-indicator" id="sessionLabel">未选择会话</span>
</div>

<!-- 加载状态条 -->
<div class="status-bar" id="statusBar"></div>

<!-- 会话列表侧滑面板 -->
<div class="drawer-overlay" id="drawerOverlay"></div>
<div class="drawer" id="drawer">
    <div class="drawer-header">
        <h3>📋 会话历史</h3>
        <button class="drawer-close" id="drawerClose">✕</button>
    </div>
    <button class="btn-new-session" id="newSessionBtn">＋ 新建会话</button>
    <ul class="session-list" id="sessionList">
        <li style="text-align:center;color:#bbb;padding:1rem;">加载中...</li>
    </ul>
</div>

<!-- 消息区域 -->
<div class="chat-container" id="chatMessages">
    <div class="empty-hint">👋 点击左上角菜单选择或新建会话</div>
</div>

<!-- 底部输入 -->
<div class="input-bar">
    <input type="text" id="msgInput" placeholder="输入消息..." autocomplete="off" disabled>
    <button id="sendBtn" disabled>➤</button>
</div>

<script>
// ==================== 状态 ====================
const state = {
    sessionId: null,
    messages: [],         // [{role, content}]
    sessions: [],         // [{id, message_count}]
    isLoading: false,
    ws: null,
    streamingBubble: null
};

// ==================== DOM ====================
const menuBtn = document.getElementById('menuBtn');
const drawer = document.getElementById('drawer');
const drawerOverlay = document.getElementById('drawerOverlay');
const drawerClose = document.getElementById('drawerClose');
const sessionList = document.getElementById('sessionList');
const sessionLabel = document.getElementById('sessionLabel');
const chatMessages = document.getElementById('chatMessages');
const msgInput = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');
const statusBar = document.getElementById('statusBar');
const newSessionBtn = document.getElementById('newSessionBtn');

// ==================== 抽屉控制 ====================
function openDrawer() {
    drawer.classList.add('open');
    drawerOverlay.classList.add('open');
}
function closeDrawer() {
    drawer.classList.remove('open');
    drawerOverlay.classList.remove('open');
}
menuBtn.onclick = openDrawer;
drawerClose.onclick = closeDrawer;
drawerOverlay.onclick = closeDrawer;

// ==================== Toast ====================
function showToast(text) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = text;
    document.body.appendChild(t);
    setTimeout(() => { if (t.parentNode) t.parentNode.removeChild(t); }, 2200);
}

// ==================== WebSocket 连接 ====================
function connectWebSocket() {
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsUrl = `${protocol}//${window.location.host}/ws/mobile`;

    state.ws = new WebSocket(wsUrl);

    state.ws.onopen = () => {
        console.log('[WS] 已连接');
        // 连接后立即请求会话列表
        state.ws.send(JSON.stringify({ type: 'get_sessions' }));
    };

    state.ws.onmessage = (event) => {
        try {
            const msg = JSON.parse(event.data);
            handleWsMessage(msg);
        } catch (e) {
            console.error('[WS] 解析失败:', e);
        }
    };

    state.ws.onclose = () => {
        console.log('[WS] 断开，3秒后重连...');
        setTimeout(connectWebSocket, 3000);
    };

    state.ws.onerror = (e) => {
        console.error('[WS] 错误:', e);
    };
}

function handleWsMessage(msg) {
    switch (msg.type) {
        case 'session_list':
            state.sessions = msg.data || [];
            renderSessionList();
            break;

        case 'history':
            // 全量加载会话历史
            state.messages = msg.messages || [];
            state.sessionId = msg.session_id;
            renderMessages();
            updateSessionLabel();
            enableInput(true);
            closeDrawer();
            break;

        case 'new_session_created':
            state.sessionId = msg.session_id;
            state.messages = [];
            renderMessages();
            updateSessionLabel();
            enableInput(true);
            closeDrawer();
            break;

        case 'reply_start':
            // 创建流式气泡占位
            state.isLoading = true;
            statusBar.classList.add('loading');
            disableInput(true);
            state.streamingBubble = addBubble('assistant', '', true);
            break;

        case 'reply_chunk':
            // 追加内容到当前流式气泡（使用显式 in 检查，允许空字符串通过）
            if (state.streamingBubble && ('content' in msg)) {
                const current = state.streamingBubble.textContent || '';
                state.streamingBubble.textContent = current + msg.content;
                scrollBottom();
            }
            break;

        case 'reply_done':
            // 流式回复完成
            state.isLoading = false;
            statusBar.classList.remove('loading');
            disableInput(false);

            if (state.streamingBubble) {
                const fullText = state.streamingBubble.textContent || '';
                state.streamingBubble.classList.remove('streaming');
                state.messages.push({ role: 'assistant', content: fullText });
                state.streamingBubble = null;
            }

            // 回复完成后刷新会话列表（消息计数会变化）
            state.ws.send(JSON.stringify({ type: 'get_sessions' }));
            break;

        case 'error':
            console.error('[WS] 服务端错误:', msg.message);
            showToast(msg.message || '发生错误');
            state.isLoading = false;
            statusBar.classList.remove('loading');
            disableInput(false);
            if (state.streamingBubble) {
                state.streamingBubble.classList.remove('streaming');
                state.streamingBubble = null;
            }
            break;
    }
}

// ==================== 会话列表渲染 ====================
function renderSessionList() {
    sessionList.innerHTML = '';
    if (!state.sessions.length) {
        sessionList.innerHTML = '<li style="text-align:center;color:#bbb;padding:1rem;">暂无会话</li>';
        return;
    }
    state.sessions.forEach(s => {
        const li = document.createElement('li');
        li.className = 'session-item' + (s.id === state.sessionId ? ' active' : '');
        li.innerHTML = `
            <div class="sess-info">
                <div class="sess-id">${escapeHtml(s.id.slice(0, 28))}${s.id.length > 28 ? '...' : ''}</div>
                <div class="sess-meta">${s.message_count} 条消息</div>
            </div>
        `;
        li.onclick = () => selectSession(s.id);
        sessionList.appendChild(li);
    });
}

function selectSession(sessionId) {
    if (state.isLoading) return;
    closeDrawer();
    state.ws.send(JSON.stringify({
        type: 'select_session',
        session_id: sessionId
    }));
}

// ==================== 消息渲染 ====================
function renderMessages() {
    chatMessages.innerHTML = '';
    if (!state.messages.length) {
        chatMessages.innerHTML = '<div class="empty-hint">✨ 开始对话吧</div>';
        return;
    }
    state.messages.forEach(m => {
        // 容错：content 为空时显示占位文本，确保消息气泡不会"消失"
        const content = (m.content && m.content.trim()) ? m.content : '（消息内容为空）';
        addBubble(m.role, content);
    });
    scrollBottom();
}

function addBubble(role, content, streaming = false) {
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    const bubble = document.createElement('div');
    bubble.className = 'bubble' + (streaming ? ' streaming' : '');
    bubble.textContent = content;
    div.appendChild(bubble);
    chatMessages.appendChild(div);
    return bubble;
}

function updateSessionLabel() {
    if (state.sessionId) {
        sessionLabel.textContent = state.sessionId.slice(0, 20) + '...';
    } else {
        sessionLabel.textContent = '未选择会话';
    }
}

function scrollBottom() {
    chatMessages.scrollTop = chatMessages.scrollHeight;
}

// ==================== 输入控制 ====================
function enableInput(enabled) {
    msgInput.disabled = !enabled;
    sendBtn.disabled = !enabled || state.isLoading;
}

function disableInput(disabled) {
    msgInput.disabled = disabled;
    sendBtn.disabled = disabled;
}

// ==================== 发送消息 ====================
function sendMessage() {
    const text = msgInput.value.trim();
    if (!text || state.isLoading || !state.sessionId) return;
    if (!state.ws || state.ws.readyState !== WebSocket.OPEN) {
        showToast('连接未就绪，请稍候');
        return;
    }

    // 本地显示用户消息
    state.messages.push({ role: 'user', content: text });
    addBubble('user', text);
    msgInput.value = '';
    scrollBottom();

    // 通过 WebSocket 发送
    state.ws.send(JSON.stringify({
        type: 'send_message',
        session_id: state.sessionId,
        message: text
    }));
}

sendBtn.onclick = sendMessage;
msgInput.onkeydown = (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
};

newSessionBtn.onclick = () => {
    if (!state.ws || state.ws.readyState !== WebSocket.OPEN) {
        showToast('连接未就绪');
        return;
    }
    state.ws.send(JSON.stringify({ type: 'new_session' }));
};

// ==================== 工具函数 ====================
function escapeHtml(s) {
    if (!s) return '';
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ==================== 初始化 ====================
function init() {
    connectWebSocket();
    // 初始状态：输入框禁用，等待选择会话
    disableInput(true);
}
init();
</script>
</body>
</html>
